aid: kapstone-paper-and-packaging
name: KapStone Paper and Packaging
description: >-
  KapStone Paper and Packaging Corporation was a producer of containerboard,
  corrugated products, and specialty paper based in Northbrook, Illinois.
  In November 2018, KapStone was acquired by WestRock for approximately
  $4.9 billion, ending its existence as an independent public company.
  WestRock subsequently merged with Smurfit Kappa in July 2024 to form
  Smurfit Westrock, the global combined entity that today inherits the
  legacy KapStone operations.
